<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}建筑幕墙检测报告工具{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
    <header class="topbar">
        <div class="wrap bar">
            <a class="brand" href="{{ url_for('pages.index') }}">建筑幕墙检测报告工具</a>
            <nav>
                <a href="{{ url_for('pages.index') }}">首页</a>
                <a href="{{ url_for('defects.new') }}">缺陷填报</a>
                <a href="{{ url_for('projects.index') }}">项目</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        {% block content %}{% endblock %}
    </main>

    <footer class="wrap foot">
        本期范围：立柱 / 横梁截面尺寸检测（5 个厚度值自动计算最小值）· 缺陷检测填报 · 项目级 Word 导出
    </footer>
</body>
</html>
